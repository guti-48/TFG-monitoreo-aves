name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-node.txt
            requirements-dev.txt

      - name: Instalar bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libportaudio2 libsndfile1

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Ejecutar pruebas Python
        run: python -m pytest -q

      - name: Validar JavaScript
        run: node --check frontend/js/dashboard.js

      - name: Validar scripts de Raspberry
        run: bash -n scripts/raspberry_pi/*.sh
