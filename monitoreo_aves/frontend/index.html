<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdMonitor | Panel de monitoreo acústico</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="assets/birdmonitor-ostrero.png">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css?v=1027">
</head>

<body>
    <div id="app-shell">

        <aside id="sidebar-wrapper">
            
            <div class="sidebar-brand">
                <span class="brand-icon" aria-hidden="true">
                    <img src="assets/birdmonitor-ostrero.png" alt="">
                </span>
                <div class="brand-text">BirdMonitor</div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" id="btn-dashboard" class="nav-link active" onclick="switchView('dashboard'); return false;">
                    <i class="bi bi-activity"></i>
                    <span>Tiempo Real</span>
                </a>
                <a href="#" id="btn-live" class="nav-link" onclick="switchView('live'); return false;">
                    <i class="bi bi-broadcast-pin"></i>
                    <span>Escucha en directo</span>
                </a>
                <a href="#" id="btn-history" class="nav-link" onclick="switchView('history'); return false;">
                    <i class="bi bi-database-fill"></i>
                    <span>Histórico</span>
                </a>
                <a href="#" id="btn-science" class="nav-link" onclick="switchView('science'); return false;">
                    <i class="bi bi-bar-chart-line-fill"></i>
                    <span>Análisis ecológico</span>
                </a>
                <a href="#" id="btn-nodes" class="nav-link" onclick="switchView('nodes'); return false;">
                    <i class="bi bi-hdd-network"></i>
                    <span>Nodos</span>
                </a>
                <a href="#" id="btn-daily" class="nav-link" onclick="switchView('daily')">
                    <i class="bi bi-calendar-check me-2"></i>Informe diario
                </a>
            </nav>

            <div class="sidebar-footer">
                <form action="/auth/logout" method="post">
                    <button type="submit" class="nav-link sidebar-logout">
                        <i class="bi bi-box-arrow-left"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </form>
                <div class="sidebar-version">v2.1 · Sevilla, ES</div>
            </div>
        </aside>


        <div id="page-content-wrapper">

            <!-- Topbar -->
            <header id="topbar">
                <div class="topbar-left d-flex align-items-center">
                    <button id="mobile-menu-toggle" class="btn text-white p-0 me-3 d-md-none" style="border: none; background: transparent;">
                        <i class="bi bi-list fs-1"></i>
                    </button>
                    <i class="bi bi-broadcast-pin topbar-icon d-none d-md-block me-2"></i>
                    <div class="topbar-title-group">
                        <span id="topbar-view-title" class="fw-bold">Monitorización global</span>
                        <span class="topbar-context">Nodo Edge · BirdNET · Bioacústica</span>
                    </div>
                </div>
            </header>
            <!-- Contenido dinámico -->
            <main id="main-content"></main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
    <script src="js/dashboard.js?v=1036"></script>
</body>
</html>
